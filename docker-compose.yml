services:
  speedmon:
    build: .
    image: speedmon:latest
    container_name: speedmon
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - TZ=Europe/Rome      # fuso orario: le fasce orarie seguono l'ora italiana
    volumes:
      - ./data:/app/data      # persistenza SQLite + impostazioni
