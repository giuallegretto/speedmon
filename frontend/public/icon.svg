<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- sfondo -->
  <rect width="512" height="512" rx="112" fill="#0a0e17"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>

  <!-- arco tachimetro (quadrante) -->
  <path d="M 120 340 A 150 150 0 1 1 392 340"
        stroke="#1e2a3d" stroke-width="26" stroke-linecap="round" fill="none"/>
  <!-- arco attivo (velocità raggiunta) -->
  <path d="M 120 340 A 150 150 0 0 1 300 130"
        stroke="url(#arc)" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- tacche del quadrante -->
  <g stroke="#2b3a52" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="96" x2="256" y2="120"/>
    <line x1="366" y1="140" x2="350" y2="158"/>
    <line x1="146" y1="140" x2="162" y2="158"/>
  </g>

  <!-- onda/segnale al centro (telemetria) -->
  <path d="M 150 268 L 196 268 L 220 210 L 260 322 L 296 244 L 320 268 L 366 268"
        stroke="url(#wave)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- lancetta tachimetro -->
  <circle cx="256" cy="356" r="20" fill="#3ddc84"/>
  <circle cx="256" cy="356" r="9" fill="#0a0e17"/>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1826"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="arc" x1="120" y1="340" x2="300" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#4aa8ff"/>
    </linearGradient>
    <linearGradient id="wave" x1="150" y1="268" x2="366" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3ddc84"/>
      <stop offset="0.5" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#3ddc84"/>
    </linearGradient>
  </defs>
</svg>
